# /etc/nginx/sites-available/helpme
# depois: sudo certbot --nginx -d suporte.fninfohouse.com.br -d os.fninfohouse.com.br
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {                       # Help me!: painel, tela remota (WebSocket), agentes e site de downloads
    listen 80;
    server_name suporte.fninfohouse.com.br;
    client_max_body_size 2g;   # envio de drivers e instaladores para a biblioteca
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;   # conexões de tela e de controle ficam abertas
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}

server {                       # Gestor de OS
    listen 80;
    server_name os.fninfohouse.com.br;
    client_max_body_size 8m;
    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
